# Transformer baseline
# Usage: python -m faraway.torch.run_experiment configs/transformer_baseline.yaml

experiment_name: "transformer_baseline_repro"

player_type: "transformer"
n_rounds: 8
draft_size: 10
use_bonus_cards: true
use_hand: false
n_cards_hand: 3
verbose: 2

model_params:
  embed_dim: 32
  n_attention_heads: 8
  n_transformer_layers: 2
  dropout_rate: 0.1

player_params:
  use_mode_embedding: true

rl_params:
  optimizer_params:
    lr: 0.001

phases:
  - name: "main_training"
    n_steps: 500
    rl_params:
      train_batch_size: 128
      advantage:
        prior_baseline_score: 29
        update_baseline_rate: 0.02
      optimizer_params:
        lr: 0.001
    eval_flows:
      - type: vs_random
        every: 100
        n_players: 1
        n_batches: 50
        batch_size: 64
        initial_eval: true
      - type: solo
        every: 100
        n_batches: 50
        batch_size: 64
        initial_eval: true
