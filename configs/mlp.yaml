# MLP baseline
# Usage: python -m faraway.torch.run_experiment configs/mlp.yaml

experiment_name: "mlp"

player_type: "mlp"
n_rounds: 8
draft_size: 3
use_bonus_cards: true
use_hand: true
n_cards_hand: 3
verbose: 2

model_params:
  dropout_rate: 0.1

player_params:
  use_cards_hand_in_state: false
  use_draft_indicator_in_model_input: false

rl_params:
  optimizer_params:
    lr: 0.001

phases:
  - name: "main_training"
    n_steps: 10000
    rl_params:
      train_batch_size: 128
      advantage:
        update_baseline_rate: 0.02
      optimizer_params:
        lr: 0.0005
    eval_flows:
      - type: vs_random
        every: 100
        n_players: 1
        n_batches: 50
        batch_size: 64
        initial_eval: true
      - type: solo
        every: 100
        n_batches: 50
        batch_size: 64
        initial_eval: true
