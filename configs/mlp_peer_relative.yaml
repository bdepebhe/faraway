# Large transformer config
# Higher capacity model for longer training
#
# Usage:
#   python -m faraway.torch.main configs/transformer_large.yaml

experiment_name: "mlp_peer_relative"

player_type: "mlp"
n_rounds: 8
draft_size: 3
use_bonus_cards: true
use_hand: true
n_cards_hand: 3
verbose: 2

model_params:
  dropout_rate: 0.1

player_params:
  use_cards_hand_in_state: false
  use_draft_indicator_in_model_input: false

optimizer_params:
  lr: 0.001

phases:
  - name: "main_training"
    n_steps: 5000
    eval_vs_random_config:
      every: 200
      n_players: 1
      n_batches: 50
      batch_size: 64
      initial_eval: true
    eval_solo_config:
      every: 200
      n_batches: 50
      batch_size: 64
      initial_eval: true
    rl_params:
      train_batch_size: 128
      update_baseline_rate: 0.02
      peer_relative_reward: true
      advantage_peer_normalization: "zscore"
      peer_sub_batch_size: 16
    optimizer_params:
      lr: 0.0005
